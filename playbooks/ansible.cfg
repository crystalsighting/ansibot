[defaults]
stdout_callback = default
callback_result_format = yaml
# Self-contained paths
inventory = ~/playbooks/hosts
roles_path = ~/playbooks/roles
collections_path = ~/playbooks/collections
# Disable host key prompts for automated runs
host_key_checking = False
# color - good for CLI and forgejo logs, disable if need clean output
force_color = 1

[ssh_connection]
# Pipelining executes python modules directly in memory over SSH without SFTP file copy
pipelining = True
# 15 min keep ssh connection reuse, finish upgrades/jobs
ssh_args = -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ControlMaster=auto -o ControlPersist=900s -o PreferredAuthentications=publickey
