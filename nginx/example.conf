# ansibot.mydomain.com
server {
    listen 192.168.0.21:443 ssl;
    http2 on;
    server_name ansibot.mydomain.com;

    ssl_certificate     /usr/local/etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /usr/local/etc/letsencrypt/live/mydomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_prefer_server_ciphers on;
    error_page 497 https://$host$request_uri;

    # --- MCP: no basic auth; Bearer handled by FastMCP ---
    location /mcp {
        proxy_pass http://192.168.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass Bearer through to FastMCP
        proxy_set_header Authorization $http_authorization;
    }

    # --- Web UI: basic auth ---
    location / {
        auth_basic "Restricted Access - Ansibot";
        auth_basic_user_file /usr/local/etc/ansibot/.htpasswd;
        proxy_pass http://192.168.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /usr/nginx_logs/ansibot.mydomain.com.log combined;
    error_log  /usr/nginx_logs/ansibot.mydomain.com.error;
}
