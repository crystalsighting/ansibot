# --- Ansibot config ---
# Includes Simple WebUI to run playbooks and view Forgejo logs
# Strongly suggest nginx up front of this with basic AUTH if using public/untrusted IP
[server]
host = 192.168.0.1                                   # IP to bind to
port = 8000                                          # Port to bind to
verify_ssl = false                                   # Verify SSL
limit = 30                                           # Max logs to show on page
playbooks = /var/db/act_runner/playbooks             # Playbooks directory (should be a directory your forgejo runner can access)
#token = 769902adfdef1005de7fe217331f8125d0ce0066824da2cbc74e1ab1a57110ab # OPTIONAL: Bearer token for MCP clients (openssl rand -hex 32)

[forgejo]
url = http://127.0.0.1:3000                         # Forgejo url (Your nginx proxy url suggested ie: https://github.domain.com)
repo = ansibot                                       # Forgejo repository name
owner = crystalsighting                              # Forgejo repository owner
token = 39144cf98447d9075cd71dd8f42638bb3d8ba3c5     # Forgejo generated token (token should be able to create repo and upload "workflow" file)
private = false                                      # Create repository as private if does not exist (true/false)
workflow = /usr/local/etc/ansibot/playbook.yml       # Forgejo repository workflow file (this is what controls ansible-playbooks)
                                                     # uploads to .forgejo/workflows/playbook.yml for example on startup
# --- MCP Tools/playbook definitions  ---
# Example 1:
#
# [tool]                   # MCP tool name - https://modelcontextprotocol.io/specification/2025-11-25/server/tools#tool-names
# playbook = test/echo.yml # Path to playbook relative to [server] playbooks directory
# description = my descr   # Description of MCP tool
#
# Example 2: Defining args a playbook supports: (Useful for an AI passing args dynamically)
#            Ie: update this dns record, or add this subdomain to nginx  
# [test-echo]
# playbook = test/echo.yml
# description = Test passing custom arguments to an Ansible playbook.
# args = message, count
#

# Tests
[test-echo]
playbook = test/echo.yml
description = Test passing custom arguments to an Ansible playbook.
args = message, count
